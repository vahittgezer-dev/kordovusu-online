<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#080603">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Kor Dovusu</title>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5832452426246320" crossorigin="anonymous"></script>
  <style>
    :root{color-scheme:dark;--gold:#e5b942;--gold2:#8f6418;--ink:#050403}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030302}
    body{display:flex;align-items:center;justify-content:center;font-family:Arial,"Noto Sans",sans-serif;color:#f5ecd5;touch-action:none;overscroll-behavior:none}
    /* The game UI is authored for 720x1080. Keeping that 2:3 ratio prevents
       browser windows from stretching panels, card frames and menu artwork. */
    #canvas{display:block;width:min(100vw,calc(100vh * 2 / 3));height:min(100vh,calc(100vw * 3 / 2));aspect-ratio:2/3;outline:0;background:#000;box-shadow:0 0 42px rgba(0,0,0,.92);touch-action:none}
    #loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:28px;background:radial-gradient(circle at 50% 38%,rgba(181,126,24,.22),transparent 30%),linear-gradient(#0c0905,#020202)}
    #loading.hidden{opacity:0;visibility:hidden;transition:opacity .45s ease,visibility .45s}
    .loader{width:min(610px,92vw);text-align:center}
    #brand{width:min(150px,30vw);height:min(150px,30vw);object-fit:contain;filter:drop-shadow(0 0 24px rgba(232,183,61,.42));animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(1.035);filter:drop-shadow(0 0 34px rgba(232,183,61,.58))}}
    .title{margin:14px 0 4px;color:var(--gold);font-weight:900;font-size:clamp(23px,5vw,34px);letter-spacing:2px}.subtitle{color:#a99569;font-size:12px;letter-spacing:2.2px}
    .fact{margin:28px auto 20px;padding:17px 20px;min-height:105px;display:flex;flex-direction:column;justify-content:center;border:1px solid rgba(229,185,66,.48);border-radius:15px;background:linear-gradient(135deg,rgba(32,24,11,.76),rgba(5,5,4,.88));box-shadow:0 18px 55px #000,inset 0 0 30px rgba(196,137,24,.06)}
    .fact b{margin-bottom:9px;color:var(--gold);font-size:11px;letter-spacing:2.3px}.fact span{font-size:clamp(14px,3.1vw,18px);line-height:1.5;transition:.22s}.fact span.fade{opacity:0;transform:translateY(4px)}
    progress{display:block;width:100%;height:9px;border:1px solid rgba(229,185,66,.55);border-radius:20px;overflow:hidden;background:#17130d}progress::-webkit-progress-bar{background:#17130d}progress::-webkit-progress-value{background:linear-gradient(90deg,var(--gold2),#f5d76d)}progress::-moz-progress-bar{background:linear-gradient(90deg,var(--gold2),#f5d76d)}
    .meta{display:flex;justify-content:space-between;margin-top:9px;color:#9f9274;font-size:11px;font-weight:700;letter-spacing:.5px}
    #notice{display:none;margin-top:16px;padding:14px;border:1px solid #a64343;border-radius:10px;background:#321818;color:#ffd8d8;white-space:pre-line}
    #fullscreen{display:none;position:fixed;z-index:30;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));width:48px;height:48px;border:1px solid rgba(229,185,66,.72);border-radius:12px;background:rgba(8,6,3,.84);color:var(--gold);font-size:25px;line-height:1;box-shadow:0 5px 20px #000;cursor:pointer;-webkit-tap-highlight-color:transparent}
    #fullscreen:active{transform:scale(.94)}
    #rotate{display:none;position:fixed;inset:0;z-index:40;align-items:center;justify-content:center;padding:30px;text-align:center;background:#050403;color:var(--gold);font-size:20px;font-weight:800}
    @media(orientation:landscape) and (max-height:520px){#rotate{display:flex}}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0">Tarayıcınız oyun alanını desteklemiyor.</canvas>
  <button id="fullscreen" type="button" aria-label="Tam ekran" title="Tam ekran">⛶</button>
  <div id="rotate">En iyi deneyim için telefonunu dik konuma çevir.</div>
  <div id="loading">
    <div class="loader">
      <img id="brand" src="index.png" alt="Kör Dövüşü">
      <div class="title">KÖR DÖVÜŞÜ</div><div class="subtitle">SAHA HAZIRLANIYOR</div>
      
      <!-- Google Play Store Yönlendirme Logosu -->
      <a href="https://play.google.com/store/apps/details?id=com.kordovusu.app" target="_blank" style="display: inline-block; margin-top: 15px; transition: transform 0.2s;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/tr_badge_web_generic.png" alt="Google Play'den Alın" style="height: 48px; object-fit: contain;">
      </a>

      <div class="fact"><b>💡 OYUN İPUCU</b><span id="factText">Saha ve kartlar hazırlanıyor…</span></div>
      <progress id="progress" max="1" value="0"></progress>
      <div class="meta"><span id="sizeText">BAĞLANTI KURULUYOR</span><span id="percentText">0%</span></div>
      <div id="notice"></div>
    </div>
  </div>
  <noscript>Bu oyunu çalıştırmak için JavaScript gereklidir.</noscript>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":76039528,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
    const GODOT_THREADS_ENABLED=false;
    const facts=[
      "Her gün oyuna giriş yaparak Görevler sekmesinden günlük altın ve paket ödüllerini toplamayı unutma!",
      "Kartlarının güç ve yetenek değerlerini iyi analiz et; ikili mücadelelerde doğru kartı seçmek zaferi getirir.",
      "Mağaza bölümündeki günlük sınırlı paketleri takip ederek efsanevi futbolcuları kadrona katabilirsin.",
      "Kadro menüsünden takım dizilişini düzenle; en güçlü ilk 11'ini kurarak maçlara avantajlı başla.",
      "Arkadaşla Maç lobisinden dilediğin odaya katılabilir veya şifreli odalarla arkadaşlarınla özel maç yapabilirsin.",
      "Pazar sekmesini kullanarak kadrona uymayan kartları satıp yerine istediğin yıldız futbolcuları transfer edebilirsin.",
      "Maçlarda rakibinin stratejisini tahmin et; doğru hamle zamanlamasıyla kritik goller bulabilirsin.",
      "Hesabını kaydedip giriş yaparak altınlarını, desteni ve tüm ilerlemeni bulutta güvenle saklayabilirsin.",
      "Lig maçlarını kazanıp puanları topla; lig sıralamasında zirveye tırmanarak büyük ödüllere hak kazan!",
      "Günlük ve haftalık görevleri tamamlayarak ekstra bonus altın ve nadir kart paketleri kazanabilirsin."
    ].sort(()=>Math.random()-.5);
    const overlay=document.getElementById('loading'),progress=document.getElementById('progress'),fact=document.getElementById('factText'),notice=document.getElementById('notice'),percent=document.getElementById('percentText'),size=document.getElementById('sizeText');
    let fi=0;function nextFact(){fact.classList.add('fade');setTimeout(()=>{fact.textContent=facts[fi++%facts.length];fact.classList.remove('fade')},220)}nextFact();const factTimer=setInterval(nextFact,4600);
    async function fullscreen(){try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('portrait').catch(()=>{})}else await document.exitFullscreen()}catch(e){console.info('Tam ekran tarayıcı tarafından engellendi',e)}}
    document.getElementById('fullscreen').addEventListener('click',fullscreen);
    const engine=new Engine(GODOT_CONFIG);
    const missing=Engine.getMissingFeatures({threads:GODOT_THREADS_ENABLED});
    function fail(error){console.error(error);progress.style.display='none';notice.style.display='block';notice.textContent='Oyun başlatılamadı. Sayfayı yenileyip tekrar dene.\n'+(error&&error.message?error.message:error)}
    if(missing.length){fail(new Error('Tarayıcı desteği eksik: '+missing.join(', ')))}else{
      engine.startGame({onProgress:(current,total)=>{if(current>0&&total>0){progress.value=current;progress.max=total;const p=Math.min(100,Math.round(current/total*100));percent.textContent=p+'%';size.textContent=(current/1048576).toFixed(1)+' / '+(total/1048576).toFixed(1)+' MB'}}}).then(()=>{clearInterval(factTimer);overlay.classList.add('hidden');setTimeout(()=>overlay.remove(),500);document.getElementById('canvas').focus()}).catch(fail)
    }
  </script>
</body>
</html>
